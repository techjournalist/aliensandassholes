      P(GEO.sphereLo, gd, M(-0.1, 0.05, 0.02, { sx: 0.09, sy: 0.05, sz: 0.11 }), true, { name: 'footR', live: true }),
      P(GEO.sphere, g, M(0, 0.5, 0, { sx: 0.25, sy: 0.23, sz: 0.24 }), true, { name: 'head' }),
      P(GEO.cone, g, pivotMatrix(0.2, 0.56, 0, 0, 0, -1.2, 0, 0.13, 0, 0.07, 0.26, 0.05), true, { name: 'earL', live: true }),
      P(GEO.cone, g, pivotMatrix(-0.2, 0.56, 0, 0, 0, 1.2, 0, 0.13, 0, 0.07, 0.26, 0.05), true, { name: 'earR', live: true }),
      P(GEO.sphereLo, PALETTE.cream, M(0.09, 0.54, 0.2, { s: 0.055 }), false, { unlit: true }),
      P(GEO.sphereLo, PALETTE.cream, M(-0.09, 0.54, 0.2, { s: 0.055 }), false, { unlit: true }),
      P(GEO.sphereLo, PALETTE.outline, M(0.1, 0.54, 0.245, { s: 0.025 }), false, { unlit: true }),
      P(GEO.sphereLo, PALETTE.outline, M(-0.08, 0.54, 0.245, { s: 0.025 }), false, { unlit: true }),
      P(GEO.cone, gd, M(0, 0.47, 0.3, { sx: 0.05, sy: 0.18, sz: 0.05, rx: Math.PI / 2 }), true, { name: 'nose' }),
      P(GEO.box, PALETTE.cream, M(0.05, 0.4, 0.21, { sx: 0.04, sy: 0.05, sz: 0.02 }), false, { unlit: true }),
      P(GEO.sphereLo, g, M(0.2, 0.26, 0.06, { s: 0.06 }), true, { name: 'armL' }),
      P(GEO.sphereLo, g, M(-0.2, 0.26, 0.06, { s: 0.06 }), true, { name: 'armR' }),
      P(GEO.cyl, PALETTE.wood, pivotMatrix(-0.22, 0.26, 0.06, 0.5, 0, 0.35, 0, 0.14, 0, 0.03, 0.3, 0.03), true, { name: 'club' }),
      P(GEO.sphereLo, PALETTE.woodLight, pivotMatrix(-0.22, 0.26, 0.06, 0.5, 0, 0.35, 0, 0.3, 0, 0.06, 0.06, 0.06), true, { name: 'clubHead' }),
    ];
  }

  // -------- particles: a pooled dust puff --------
  const particles = [];
  function buildParticles() {
    for (let i = 0; i < 48; i++) {
      const m = new THREE.Mesh(GEO.sphereLo, new THREE.MeshBasicMaterial({ color: PALETTE.cream, transparent: true, opacity: 0 }));
      m.visible = false;
      m.userData = { life: 0, ttl: 1, vx: 0, vy: 0, vz: 0, size: 0.1 };
      scene.add(m);
      particles.push(m);
    }
    animated.push({
      update(t, dt) {
        for (const p of particles) {
          const u = p.userData;
          if (!p.visible) continue;
          u.life += dt;
          if (u.life >= u.ttl) { p.visible = false; continue; }
          const k = u.life / u.ttl;
          u.vy -= 1.6 * dt;
          p.position.x += u.vx * dt; p.position.y += u.vy * dt; p.position.z += u.vz * dt;
          if (p.position.y < 0.03) { p.position.y = 0.03; u.vy = Math.abs(u.vy) * 0.3; }
          p.scale.setScalar(u.size * (1 - k * 0.6));
          p.material.opacity = 0.85 * (1 - k);
        }
      },
    });
  }
  function puff(x, y, z, { count = 8, color = PALETTE.cream, speed = 1.2, size = 0.1, up = 1.4, ttl = 0.6 } = {}) {
    let n = 0;
    for (const p of particles) {
      if (p.visible) continue;
      const a = Math.random() * Math.PI * 2, s = speed * (0.5 + Math.random() * 0.5);
      p.position.set(x, y, z);
      p.userData = { life: 0, ttl: ttl * (0.7 + Math.random() * 0.5), vx: Math.cos(a) * s, vy: up * (0.4 + Math.random() * 0.6), vz: Math.sin(a) * s, size: size * (0.6 + Math.random() * 0.8) };
      p.material.color.setHex(color);
      p.visible = true;
      if (++n >= count) break;
    }
  }

  // -------- camera shake --------
  const shake = { amp: 0, decay: 0, x: 0, y: 0 };
  function shakeCamera(amp, dur = 0.3) {
    shake.amp = Math.max(shake.amp, amp);
    shake.decay = amp / dur;
  }

  // -------- tower views --------
  const towerViews = new Map();
  function addTowerView(tower) {
    const g = liveProp(slingerParts(), tower.x, 0, tower.z);
    g.name = `tower-${tower.id}`;
    decal(0, 0, 0.36, g);
    const v = {
      group: g, tower, born: GameState.state.time,
      hat: g.getObjectByName('hat'), sprout: g.getObjectByName('sprout'),
      hatRz: g.getObjectByName('hat').rotation.z,
    };
    towerViews.set(tower.id, v);
    puff(tower.x, 0.1, tower.z, { count: 12, color: PALETTE.path, speed: 1.6, size: 0.12, up: 1.0 });
    return v;
  }
  function updateTowerViews(t) {
    for (const v of towerViews.values()) {
      const age = t - v.born;
      // placement pop: sprout up from nothing with an overshoot, then settle
      let pop = 1;
      if (age < 0.5) {
        const k = age / 0.5;
        pop = 1 + Math.sin(k * Math.PI) * 0.35 * (1 - k) ;
        const grow = Math.min(1, age / 0.22);
        v.group.scale.set(grow * (2 - pop), grow * pop, grow * (2 - pop));
      } else {
        const bob = Math.sin(t * 2.2 + v.tower.id);
        v.group.scale.set(1 - 0.015 * bob, 1 + 0.03 * bob, 1 - 0.015 * bob);
      }
      v.group.rotation.y = v.tower.facing + Math.sin(t * 0.8 + v.tower.id * 1.7) * 0.2;
      v.hat.rotation.z = v.hatRz + Math.sin(t * 2.2 + v.tower.id + 0.5) * 0.05;
      v.sprout.rotation.z = -0.5 + Math.sin(t * 3 + v.tower.id) * 0.25;
    }
  }

  // -------- enemy views --------
  const enemyViews = new Map();
  const dying = [];   // views playing an exit animation before removal
  function addEnemyView(e) {
    const g = liveProp(gruntParts(), e.x, 0, e.z);
    g.name = `enemy-${e.id}`;
    const v = {
      group: g, e, decal: decal(0, 0, 0.3, g),
      earL: g.getObjectByName('earL'), earR: g.getObjectByName('earR'),
      footL: g.getObjectByName('footL'), footR: g.getObjectByName('footR'),
      earM: new THREE.Matrix4(), footLz: 0.02, footRz: 0.02,
    };
    v.earL.matrixAutoUpdate = false; v.earR.matrixAutoUpdate = false;
    enemyViews.set(e.id, v);
    puff(e.x, 0.3, e.z, { count: 7, color: PALETTE.spore, speed: 0.8, size: 0.09, up: 1.2 });
    return v;
  }
  function updateEnemyViews(t, dt) {
    for (const v of enemyViews.values()) {
      const e = v.e, g = v.group;
      const cycle = e.dist * 7.5;
      const bounce = Math.abs(Math.sin(cycle));
      const born = Math.min(1, e.age / 0.35);   // pop out of the crack
      g.position.set(e.x, 0.09 * bounce, e.z);
      g.rotation.y = Math.atan2(e.dirX, e.dirZ);
      g.rotation.x = 0.1;
      g.rotation.z = Math.sin(cycle) * 0.08;
      const stretch = 0.9 + 0.22 * bounce;
      const s = born * (1 - (1 - born) * 0.5);
      g.scale.set(s * (1.06 - 0.1 * bounce), s * stretch, s * (1.06 - 0.1 * bounce));
      const flap = 0.35 + 0.45 * bounce;
      pivotMatrix(0.2, 0.56, 0, 0, 0, -1.2 + flap, 0, 0.13, 0, 0.07, 0.26, 0.05, v.earL.matrix);
      pivotMatrix(-0.2, 0.56, 0, 0, 0, 1.2 - flap, 0, 0.13, 0, 0.07, 0.26, 0.05, v.earR.matrix);
      v.footL.position.z = 0.02 + Math.sin(cycle) * 0.12;
      v.footR.position.z = 0.02 - Math.sin(cycle) * 0.12;
      v.footL.position.y = 0.05 + Math.max(0, Math.sin(cycle)) * 0.06 - 0.09 * bounce;
      v.footR.position.y = 0.05 + Math.max(0, -Math.sin(cycle)) * 0.06 - 0.09 * bounce;
      v.decal.scale.setScalar(0.3 * (1 - 0.3 * bounce));
      v.decal.position.y = 0.012 - 0.09 * bounce;   // keep the shadow flat on the ground while the body hops
    }
    for (let i = dying.length - 1; i >= 0; i--) {
      const d = dying[i];
      d.t += dt;
      const k = d.t / d.dur;
      if (k >= 1) { scene.remove(d.group); dying.splice(i, 1); continue; }
      d.update(k);
    }
  }
  function removeEnemyView(e, exit) {
    const v = enemyViews.get(e.id);
    if (!v) return;
    enemyViews.delete(e.id);
    exit(v);
  }
  // Leak: the goblin squeezes through the gate with a spin and a puff.
  function leakExit(v) {
    const g = v.group;
    const x0 = g.position.x, z0 = g.position.z;
    const gate = GameState.gate;
    dying.push({
      group: g, t: 0, dur: 0.38,
      update(k) {
        g.position.x = x0 + (gate.x - x0) * k;
        g.position.z = z0 + (gate.z - 0.25 - z0) * k;
        g.position.y = 0.15 * Math.sin(k * Math.PI);
        g.rotation.y += 0.6;
        const s = (1 - k) * (1 + 0.3 * Math.sin(k * Math.PI));
        g.scale.set(s * 1.1, s * 0.8, s * 1.1);
      },
    });
    puff(gate.x, 0.3, gate.z + 0.1, { count: 10, color: PALETTE.stone, speed: 1.4, size: 0.11 });
    shakeCamera(0.09, 0.35);
  }

  // -------- selection, range preview --------
  let rangeRing, rangeDisc;
  function buildSelection() {
    const ringGeo = new THREE.RingGeometry(0.34, 0.44, 24);
    ringGeo.rotateX(-Math.PI / 2);
    selectionRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: PALETTE.gold, transparent: true, opacity: 0.95, depthWrite: false }));
    selectionRing.position.y = 0.02;
    selectionRing.visible = false;
    scene.add(selectionRing);
    rejectRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xff5a6e, transparent: true, opacity: 0.9, depthWrite: false }));
    rejectRing.position.y = 0.02;
    rejectRing.visible = false;
    scene.add(rejectRing);
    // range preview: a thin ring plus a faint disc, sized per tower type
    const rg = new THREE.RingGeometry(0.96, 1, 64);
    rg.rotateX(-Math.PI / 2);
    rangeRing = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ color: PALETTE.cream, transparent: true, opacity: 0.7, depthWrite: false }));
    rangeRing.position.y = 0.016;
    rangeRing.visible = false;
    scene.add(rangeRing);
    rangeDisc = new THREE.Mesh(GEO.circle, new THREE.MeshBasicMaterial({ color: PALETTE.cream, transparent: true, opacity: 0.1, depthWrite: false }));
    rangeDisc.position.y = 0.014;
    rangeDisc.visible = false;
    scene.add(rangeDisc);

    animated.push({
      update(t, dt) {
        const sel = GameState.state.selected;
        selectionRing.visible = !!sel;
        rangeRing.visible = rangeDisc.visible = !!sel;
        if (sel) {
          const x = worldX(sel.c), z = worldZ(sel.r);
          selectionRing.position.x = x; selectionRing.position.z = z;
          const s = 1 + 0.06 * Math.sin(t * 5);
          selectionRing.scale.set(s, 1, s);
          selectionRing.rotation.y = t * 0.6;
          const range = sel.kind === 'tower'
            ? (GameState.state.towers.find((tw) => tw.id === sel.id) || { range: 0 }).range
            : GameState.TOWER_TYPES.slinger.range;
          rangeRing.position.x = rangeDisc.position.x = x;
          rangeRing.position.z = rangeDisc.position.z = z;
          rangeRing.scale.set(range, 1, range);
          rangeDisc.scale.set(range, 1, range);
          rangeRing.material.opacity = sel.kind === 'tower' ? 0.75 : 0.45 + 0.15 * Math.sin(t * 4);
        }
        if (rejectTimer > 0) {
          rejectTimer -= dt;
          rejectRing.visible = rejectTimer > 0;
          const k = Math.max(0, rejectTimer / 0.4);
          rejectRing.material.opacity = k;
          rejectRing.position.x = worldX(rejectCell.c) + Math.sin(rejectTimer * 60) * 0.05 * k;
          rejectRing.position.z = worldZ(rejectCell.r);
          rejectRing.scale.setScalar(1.2 - 0.2 * k);
        }
      },
    });
    GameState.on('tileRejected', (res) => {
      if (!GameState.inGrid(res.c, res.r)) return;
      rejectTimer = 0.4;
      rejectCell = res;
    });
    GameState.on('towerPlaced', addTowerView);
    GameState.on('enemySpawned', addEnemyView);
    GameState.on('enemyLeaked', (e) => removeEnemyView(e, leakExit));
  }

  // -------- camera --------
  const camBase = new THREE.Vector3(), camRight = new THREE.Vector3(), camUp = new THREE.Vector3();
  function placeCamera() {
    const el = THREE.MathUtils.degToRad(CONFIG.cameraElevation);
    const yaw = THREE.MathUtils.degToRad(CONFIG.cameraYaw);
    const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(el), Math.sin(el), Math.cos(yaw) * Math.cos(el));
    camera.position.copy(dir.multiplyScalar(40));
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld(true);
    camBase.copy(camera.position);
    camRight.setFromMatrixColumn(camera.matrixWorld, 0);
    camUp.setFromMatrixColumn(camera.matrixWorld, 1);
  }
  function fitCamera() {
    const aspect = cssW / cssH;
    const box = new THREE.Box3(
      new THREE.Vector3(-cols / 2 - 0.9, -tileHeight, -rows / 2 - 0.6),
      new THREE.Vector3(cols / 2 + 0.9, 4.6, rows / 2 + 0.6),
    );
    const inv = camera.matrixWorldInverse;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    const v = new THREE.Vector3();
    for (let i = 0; i < 8; i++) {
      v.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).applyMatrix4(inv);
      minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
      minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    let hw = (maxX - minX) / 2, hh = (maxY - minY) / 2;
    if (hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
    camera.left = cx - hw; camera.right = cx + hw;
    camera.top = cy + hh; camera.bottom = cy - hh;
    camera.near = 1; camera.far = 100;
    camera.updateProjectionMatrix();
    unitsPerPixel = (hw * 2) / cssW;
    outlineMat.uniforms.thickness.value = CONFIG.outlinePx * unitsPerPixel;
  }

  function resize() {
    cssW = Math.max(1, window.innerWidth);
    cssH = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio));
    renderer.setSize(cssW, cssH, false);
    fitCamera();
  }

  // -------- picking --------
  const raycaster = new THREE.Raycaster();
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit = new THREE.Vector3();
  function screenToCell(x, y) {
    const ndc = new THREE.Vector2((x / cssW) * 2 - 1, -(y / cssH) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    if (!raycaster.ray.intersectPlane(groundPlane, hit)) return null;
    return { c: Math.floor(hit.x + cols / 2), r: Math.floor(hit.z + rows / 2) };
  }

  // -------- init / frame --------
  function init(canvasEl) {
    canvas = canvasEl;
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setClearColor(PALETTE.backdrop);
    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 100);

    gradientMap = new THREE.DataTexture(new Uint8Array([128, 199, 255]), 3, 1, THREE.LuminanceFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.generateMipmaps = false;
    gradientMap.needsUpdate = true;
    outlineMat = makeOutlineMaterial();
    buildPrimitives();

    scene.add(new THREE.AmbientLight(0xffffff, 0.38));
    const sun = new THREE.DirectionalLight(0xfff0d8, 0.68);
    sun.position.set(-6, 10, 7);
    scene.add(sun);

    placeCamera();
    buildGround();
    buildStream();
    buildBridge();
    buildHollow();
    buildBastion();
    buildCountryside();
    buildParticles();
    buildSelection();
    flushBatch();

    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 60));
  }

  function render(t, dt) {
    for (const a of animated) a.update(t, dt);
    updateTowerViews(t);
    updateEnemyViews(t, dt);
    if (shake.amp > 0) {
      shake.amp = Math.max(0, shake.amp - shake.decay * dt);
      shake.x = (Math.random() - 0.5) * 2 * shake.amp;
      shake.y = (Math.random() - 0.5) * 2 * shake.amp;
    } else { shake.x = shake.y = 0; }
    camera.position.copy(camBase).addScaledVector(camRight, shake.x).addScaledVector(camUp, shake.y);
    renderer.render(scene, camera);
  }

  function stats() {
    const r = renderer.info.render;
    return { calls: r.calls, triangles: r.triangles };
  }

  return { init, render, resize, screenToCell, stats, shakeCamera, puff, debugScene: () => scene, debugViews: () => ({ enemyViews: enemyViews.size, dying: dying.map((d) => [+d.t.toFixed(3), d.dur]), towerViews: towerViews.size }) };
})();

// ===================================================================
// Input  (Pointer Events: mouse and touch share one path, handleTap)
// ===================================================================
const Input = (() => {
  let down = null;
  const TAP_SLOP = 12;   // px of movement still counted as a tap

  function handleTap(x, y) {
    const cell = Renderer.screenToCell(x, y);
    if (!cell) return null;
    return GameState.selectTile(cell.c, cell.r);
  }

  function init(canvas) {
    canvas.addEventListener('pointerdown', (e) => {
      Audio.unlock();
      down = { x: e.clientX, y: e.clientY, id: e.pointerId };
      if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ } }
    });
    canvas.addEventListener('pointerup', (e) => {
      if (!down || down.id !== e.pointerId) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      down = null;
      if (moved <= TAP_SLOP) handleTap(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointercancel', () => { down = null; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  return { init, handleTap };
})();

// ===================================================================
// UI  (DOM overlay; reads GameState)
// ===================================================================
const UI = (() => {
  const $ = (id) => document.getElementById(id);
  let toastTimer = 0;
  let debugOn = false, fpsAcc = 0, fpsFrames = 0, fpsShown = 0;
  const shown = { gold: null, lives: null, wave: null, waveBtn: null };

  function updateHud() {
    const s = GameState.state;
    if (shown.gold !== s.gold) { $('hud-gold').textContent = s.gold; shown.gold = s.gold; }
    if (shown.lives !== s.lives) { $('hud-lives').textContent = s.lives; shown.lives = s.lives; }
    const wave = s.wave > 0 ? `Wave ${s.wave}/${CONFIG.totalWaves}` : 'Prep';
    if (shown.wave !== wave) { $('hud-wave').textContent = wave; shown.wave = wave; }
    const btn = $('wave-btn');
    const label = s.waveActive
      ? `${s.waveQueue.length + s.enemies.length} goblins coming`
      : (s.wave === 0 ? 'Send the first wave' : `Send wave ${s.wave + 1}`);
    if (shown.waveBtn !== label) {
      btn.textContent = label;
      btn.disabled = s.waveActive;
      shown.waveBtn = label;
    }
  }

  function toast(text, bad) {
    const el = $('toast');
    el.textContent = text;
    el.classList.toggle('bad', !!bad);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function flash(cls) {
    const el = $('flash');
    el.classList.remove('leak');
    void el.offsetWidth;   // restart the CSS animation
    el.classList.add(cls);
  }

  // The panel under the map: what you can do with the selected thing.
  function renderPanel() {
    const sel = GameState.state.selected;
    const panel = $('panel');
    if (!sel) { panel.classList.remove('show'); panel.innerHTML = ''; return; }
    panel.classList.add('show');
    if (sel.kind === 'tile') {
      const t = GameState.TOWER_TYPES.slinger;
      const afford = GameState.canAfford('slinger');
      panel.innerHTML = `
        <div class="panel-title">Build here</div>
        <button class="build-btn" data-tower="${t.id}" ${afford ? '' : 'disabled'}>
          <span class="build-icon">&#127793;</span>
          <span class="build-text"><span class="build-name">${t.name}</span><span class="build-blurb">${t.blurb}</span></span>
          <span class="build-cost ${afford ? '' : 'poor'}">&#9679; ${t.cost}</span>
        </button>`;
    } else {
      const tower = GameState.state.towers.find((tw) => tw.id === sel.id);
      const t = GameState.TOWER_TYPES[tower.type];
      panel.innerHTML = `
        <div class="panel-title">${t.name} <span class="tier">Tier ${tower.tier}</span></div>
        <div class="panel-blurb">${t.blurb}</div>`;
    }
  }

  function updateOrientation() {
    const portrait = window.innerHeight > window.innerWidth;
    const mobile = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || window.innerWidth < 720;
    $('rotate').classList.toggle('show', portrait && mobile);
  }

  function init() {
    debugOn = /[?&]debug\b/.test(location.search);
    $('debug').classList.toggle('show', debugOn);
    updateHud();
    updateOrientation();
    renderPanel();
    window.addEventListener('resize', updateOrientation);
    window.addEventListener('orientationchange', () => setTimeout(updateOrientation, 60));

    $('panel').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tower]');
      if (!btn) return;
      Audio.unlock();
      const res = GameState.placeTower(btn.dataset.tower);
      if (!res.ok && res.reason) toast(res.reason, true);
    });
    $('wave-btn').addEventListener('click', () => { Audio.unlock(); GameState.startWave(); });

    GameState.on('tileSelected', renderPanel);
    GameState.on('towerSelected', renderPanel);
    GameState.on('selectionCleared', renderPanel);
    GameState.on('towerPlaced', renderPanel);
    GameState.on('goldChanged', renderPanel);
    GameState.on('tileRejected', (res) => { renderPanel(); toast(res.reason, true); });
    GameState.on('placeRejected', (res) => toast(res.reason, true));
    GameState.on('enemyLeaked', (e) => { flash('leak'); toast(`A ${e.name} slipped into the Bastion!`, true); });
    GameState.on('waveStarted', (w) => { updateHud(); toast(w === 1 ? 'The Hollow stirs. Goblins on the road!' : `Wave ${w}. Here they come!`); });
    GameState.on('waveEnded', () => { updateHud(); toast('The road is quiet, for now.'); });
  }

  function frame(dt) {
    updateHud();
    if (!debugOn) return;
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.5) {
      fpsShown = Math.round(fpsFrames / fpsAcc);
      fpsAcc = 0; fpsFrames = 0;
      const s = Renderer.stats();
      $('debug').textContent = `${fpsShown} fps\n${s.calls} draw calls\n${s.triangles} tris\n${window.innerWidth}x${window.innerHeight} @${Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio)}x`;
    }
  }

  return { init, frame, updateHud, toast, renderPanel };
})();

// ===================================================================
// Audio  (Web Audio, synthesized; unlocked on the first pointer event)
// ===================================================================
const Audio = (() => {
  let ctx = null, master = null;

  function unlock() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  // One shaped voice: oscillator -> lowpass -> gain envelope. The filter
  // and the exponential decay are what keep this from sounding tinny.
  function voice({ type = 'sine', freq = 440, to = null, dur = 0.15, vol = 0.4, cutoff = 2400, delay = 0 }) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const filt = ctx.createBiquadFilter();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(cutoff, t0);
    filt.frequency.exponentialRampToValueAtTime(Math.max(200, cutoff * 0.35), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(filt); filt.connect(g); g.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  const sfx = {
    select() {   // a bright little two-note "pip!"
      voice({ type: 'triangle', freq: 520, to: 640, dur: 0.09, vol: 0.35, cutoff: 3200 });
      voice({ type: 'sine', freq: 780, to: 1040, dur: 0.14, vol: 0.28, cutoff: 3600, delay: 0.06 });
    },
    reject() {   // a soft, low "nuh-uh" thud
      voice({ type: 'triangle', freq: 190, to: 120, dur: 0.16, vol: 0.4, cutoff: 900 });
      voice({ type: 'square', freq: 140, to: 95, dur: 0.12, vol: 0.12, cutoff: 500, delay: 0.09 });
    },
    place() {    // a soft thump into the soil, then a springy "boing" as it sprouts
      voice({ type: 'triangle', freq: 150, to: 80, dur: 0.14, vol: 0.5, cutoff: 700 });
      voice({ type: 'sine', freq: 280, to: 760, dur: 0.24, vol: 0.32, cutoff: 2600, delay: 0.07 });
      voice({ type: 'sine', freq: 1040, to: 1180, dur: 0.12, vol: 0.14, cutoff: 3600, delay: 0.24 });
    },
    spawn() {    // a wet little goblin "blib-blub"
      voice({ type: 'square', freq: 210, to: 320, dur: 0.09, vol: 0.1, cutoff: 1100 });
      voice({ type: 'square', freq: 330, to: 240, dur: 0.12, vol: 0.09, cutoff: 1100, delay: 0.1 });
    },
    leak() {     // a bonk on the gate and a sad two-note slide
      voice({ type: 'triangle', freq: 120, to: 55, dur: 0.28, vol: 0.55, cutoff: 600 });
      voice({ type: 'sawtooth', freq: 392, to: 370, dur: 0.16, vol: 0.14, cutoff: 1200, delay: 0.05 });
      voice({ type: 'sawtooth', freq: 311, to: 250, dur: 0.3, vol: 0.14, cutoff: 1000, delay: 0.22 });
    },
    waveStart() {   // a little horn call from the Bastion walls
      voice({ type: 'sawtooth', freq: 262, to: 262, dur: 0.22, vol: 0.22, cutoff: 1600 });
      voice({ type: 'sawtooth', freq: 262, to: 262, dur: 0.18, vol: 0.2, cutoff: 1600, delay: 0.24 });
      voice({ type: 'sawtooth', freq: 392, to: 392, dur: 0.45, vol: 0.24, cutoff: 1800, delay: 0.44 });
    },
    waveEnd() {     // bright rising triad
      voice({ type: 'sine', freq: 523, to: 523, dur: 0.14, vol: 0.25, cutoff: 3000 });
      voice({ type: 'sine', freq: 659, to: 659, dur: 0.14, vol: 0.25, cutoff: 3000, delay: 0.12 });
      voice({ type: 'sine', freq: 784, to: 784, dur: 0.3, vol: 0.28, cutoff: 3200, delay: 0.24 });
    },
  };

  function init() {
    GameState.on('tileSelected', () => sfx.select());
    GameState.on('towerSelected', () => sfx.select());
    GameState.on('tileRejected', () => sfx.reject());
    GameState.on('placeRejected', () => sfx.reject());
    GameState.on('towerPlaced', () => sfx.place());
    GameState.on('enemySpawned', () => sfx.spawn());
    GameState.on('enemyLeaked', () => sfx.leak());
    GameState.on('waveStarted', () => sfx.waveStart());
    GameState.on('waveEnded', () => sfx.waveEnd());
  }

  return { init, unlock, sfx };
})();

// ===================================================================
// Boot
// ===================================================================
(function boot() {
  if (!window.THREE) {
    document.getElementById('load-error').classList.add('show');
    return;
  }
  const canvas = document.getElementById('game');
  Renderer.init(canvas);
  Input.init(canvas);
  UI.init();
  Audio.init();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    GameState.update(dt);
    Renderer.render(GameState.state.time, dt);
    UI.frame(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
